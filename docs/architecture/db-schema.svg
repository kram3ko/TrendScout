<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TrendScout database schema</title>
  <desc id="desc">Products have many trend snapshots and one current product score. Amazon categories persist the department selection used by scraping runs.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="many" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10M10 6H1" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </marker>
    <style>
      .bg{fill:#f8fafc}.card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;filter:url(#shadow)}
      .head{fill:#2563eb}.head-aux{fill:#475569}.title{fill:#fff;font:700 16px system-ui,sans-serif}
      .field{fill:#334155;font:13px ui-monospace,SFMono-Regular,monospace}.muted{fill:#64748b}
      .rel{fill:none;stroke:#64748b;stroke-width:2}.label{fill:#475569;font:600 12px system-ui,sans-serif}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760" rx="18"/>

  <g transform="translate(40 35)">
    <rect class="card" width="330" height="350" rx="12"/>
    <path class="head" d="M12 0h306a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0z"/>
    <text class="title" x="18" y="30">products</text>
    <text class="field" x="18" y="76">id <tspan class="muted">integer · PK</tspan></text>
    <text class="field" x="18" y="101">asin <tspan class="muted">varchar · unique</tspan></text>
    <text class="field" x="18" y="126">title <tspan class="muted">text</tspan></text>
    <text class="field" x="18" y="151">category <tspan class="muted">varchar · index</tspan></text>
    <text class="field" x="18" y="176">price <tspan class="muted">float · nullable</tspan></text>
    <text class="field" x="18" y="201">rating <tspan class="muted">float · nullable</tspan></text>
    <text class="field" x="18" y="226">reviews_count <tspan class="muted">integer · nullable</tspan></text>
    <text class="field" x="18" y="251">url <tspan class="muted">text</tspan></text>
    <text class="field" x="18" y="276">image_url <tspan class="muted">text</tspan></text>
    <text class="field" x="18" y="301">bestseller_rank <tspan class="muted">integer · nullable</tspan></text>
    <text class="field" x="18" y="326">created_at · updated_at <tspan class="muted">timestamptz</tspan></text>
  </g>

  <g transform="translate(480 35)">
    <rect class="card" width="320" height="300" rx="12"/>
    <path class="head" d="M12 0h296a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0z"/>
    <text class="title" x="18" y="30">trend_snapshots</text>
    <text class="field" x="18" y="76">id <tspan class="muted">integer · PK</tspan></text>
    <text class="field" x="18" y="101">product_id <tspan class="muted">integer · FK</tspan></text>
    <text class="field" x="18" y="126">keyword <tspan class="muted">varchar</tspan></text>
    <text class="field" x="18" y="151">direction <tspan class="muted">varchar</tspan></text>
    <text class="field" x="18" y="176">latest_value <tspan class="muted">integer · nullable</tspan></text>
    <text class="field" x="18" y="201">avg_first_half <tspan class="muted">float</tspan></text>
    <text class="field" x="18" y="226">avg_second_half <tspan class="muted">float</tspan></text>
    <text class="field" x="18" y="251">points_count <tspan class="muted">integer</tspan></text>
    <text class="field" x="18" y="276">created_at <tspan class="muted">timestamptz</tspan></text>
  </g>

  <g transform="translate(840 35)">
    <rect class="card" width="320" height="250" rx="12"/>
    <path class="head" d="M12 0h296a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0z"/>
    <text class="title" x="18" y="30">product_scores</text>
    <text class="field" x="18" y="76">id <tspan class="muted">integer · PK</tspan></text>
    <text class="field" x="18" y="101">product_id <tspan class="muted">integer · FK, unique</tspan></text>
    <text class="field" x="18" y="126">score <tspan class="muted">integer · 0–100</tspan></text>
    <text class="field" x="18" y="151">reasoning <tspan class="muted">text</tspan></text>
    <text class="field" x="18" y="176">boost_score <tspan class="muted">float</tspan></text>
    <text class="field" x="18" y="201">source <tspan class="muted">varchar</tspan></text>
    <text class="field" x="18" y="226">updated_at <tspan class="muted">timestamptz</tspan></text>
  </g>

  <path class="rel" d="M370 155H480" marker-end="url(#many)"/>
  <text class="label" x="402" y="143">1 : many</text>
  <path class="rel" d="M370 245H420V365H1000V285"/>
  <text class="label" x="642" y="355">1 : 0..1</text>

  <g transform="translate(25 465)">
    <rect class="card" width="270" height="225" rx="12"/>
    <path class="head-aux" d="M12 0h246a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0z"/>
    <text class="title" x="18" y="30">past_products</text>
    <text class="field" x="18" y="76">id <tspan class="muted">integer · PK</tspan></text>
    <text class="field" x="18" y="101">title <tspan class="muted">text</tspan></text>
    <text class="field" x="18" y="126">category <tspan class="muted">varchar · index</tspan></text>
    <text class="field" x="18" y="151">keywords <tspan class="muted">text</tspan></text>
    <text class="field" x="18" y="176">note <tspan class="muted">text · nullable</tspan></text>
    <text class="field" x="18" y="201">created_at <tspan class="muted">timestamptz</tspan></text>
  </g>

  <g transform="translate(315 465)">
    <rect class="card" width="270" height="225" rx="12"/>
    <path class="head-aux" d="M12 0h246a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0z"/>
    <text class="title" x="18" y="30">scrape_runs</text>
    <text class="field" x="18" y="76">id <tspan class="muted">integer · PK</tspan></text>
    <text class="field" x="18" y="101">kind · status <tspan class="muted">varchar</tspan></text>
    <text class="field" x="18" y="126">items_collected <tspan class="muted">integer</tspan></text>
    <text class="field" x="18" y="151">detail <tspan class="muted">text · nullable</tspan></text>
    <text class="field" x="18" y="176">created_at <tspan class="muted">timestamptz</tspan></text>
    <text class="field" x="18" y="201">finished_at <tspan class="muted">timestamptz · nullable</tspan></text>
  </g>

  <g transform="translate(605 465)">
    <rect class="card" width="270" height="225" rx="12"/>
    <path class="head-aux" d="M12 0h246a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0z"/>
    <text class="title" x="18" y="30">amazon_categories</text>
    <text class="field" x="18" y="76">id <tspan class="muted">integer · PK</tspan></text>
    <text class="field" x="18" y="101">slug <tspan class="muted">varchar · unique</tspan></text>
    <text class="field" x="18" y="126">name <tspan class="muted">varchar</tspan></text>
    <text class="field" x="18" y="151">enabled <tspan class="muted">boolean · index</tspan></text>
    <text class="field" x="18" y="176">available <tspan class="muted">boolean</tspan></text>
    <text class="field" x="18" y="201">created_at · updated_at</text>
  </g>

  <g transform="translate(895 465)">
    <rect class="card" width="270" height="175" rx="12"/>
    <path class="head-aux" d="M12 0h246a12 12 0 0 1 12 12v36H0V12A12 12 0 0 1 12 0z"/>
    <text class="title" x="18" y="30">users</text>
    <text class="field" x="18" y="76">id <tspan class="muted">integer · PK</tspan></text>
    <text class="field" x="18" y="101">username <tspan class="muted">varchar · unique</tspan></text>
    <text class="field" x="18" y="126">password_hash <tspan class="muted">varchar</tspan></text>
    <text class="field" x="18" y="151">created_at · updated_at <tspan class="muted">timestamptz</tspan></text>
  </g>
</svg>
